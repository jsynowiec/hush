[project]
name = "hush"
version = "0.3.3"
description = "Run a build, lint or test command and print one line on success, or file:line details on failure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Synowiec" }]
requires-python = ">=3.12"
keywords = ["cli", "ai-agents", "coding-agents", "test-runner", "linter", "pytest", "ruff", "vitest", "output-filter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jsynowiec/hush"
Repository = "https://github.com/jsynowiec/hush"
Issues = "https://github.com/jsynowiec/hush/issues"

[project.scripts]
hush = "hush:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
